name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to publish, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify release ref
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Releases must be cut from main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.11.0

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.13.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Configure git author
        run: |
          git config user.name "Daniel Munoz"
          git config user.email "dev@danmunoz.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set package version
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Verify release
        run: pnpm prepublishOnly

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Packed CLI smoke test
        run: pnpm test:pack

      - name: Commit version
        run: |
          git add package.json pnpm-lock.yaml
          git commit -m "chore: release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"

      - name: Push version commit and tag
        run: git push origin HEAD:${GITHUB_REF_NAME} --follow-tags

      - name: Publish
        run: npm publish --provenance
